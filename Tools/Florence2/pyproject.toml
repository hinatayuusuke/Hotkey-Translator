[project]
name = "florence-ocr-bridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.29.0",
    "einops",
    "pillow>=10.0.0",
    "safetensors>=0.4.0",
    "torch",
    "timm",
    "transformers",
]

[tool.uv]
index = [
    { name = "pytorch-cu121", url = "https://download.pytorch.org/whl/cu121", explicit = true },
]

[tool.uv.sources]
# NOTE: Use CUDA 12.1 wheels when available.
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
